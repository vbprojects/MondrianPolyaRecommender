scale: smoke
seed: 42
run_dir: runs/smoke-mohawk
teacher:
  name: Qwen/Qwen3-Embedding-8B
  revision: 1d8ad4ca9b3dd8059ad90a75d4983776a23d44af
  precision: bfloat16
  batch_size: 2
  device_map: auto
  # Set e.g. {0: 12GiB, cpu: 40GiB} to explicitly allow CPU offload.
  max_memory: null
model:
  backend: fla
  vocab_size: 151665
  input_rank: 256
  width: 384
  layers: 12
  heads: 6
  head_dim: 64
  conv_size: 4
  ffn_width: 1024
  depths: [1, 3, 6, 9, 12]
  dims: [64, 128, 192, 256, 384]
data:
  sources: configs/sources.yaml
  max_examples: 20000
  min_per_language: 100
  english_cap: 0.30
  long_fraction: 0.15
  default_length: 256
  long_length: 512
  validation_fraction: 0.05
  test_fraction: 0.05
  # Optional JSONL with text fields. Exact benchmark text exclusion only.
  exclude_jsonl: null
cache:
  shard_size: 256
  audit_examples: 128
initialization:
  mode: table-ffn # random | table | table-ffn; separate run_dir per ablation
  svd_rows: 16384
  ffn_score: weight-rms # deterministic weight saliency; activation saliency is future work
mohawk:
  enabled: true
  # One-based teacher block mapping, also used by FFN transfer and recovery.
  teacher_layers: [3, 6, 9, 12, 15, 18, 21, 24, 27, 30, 33, 36]
  examples: 256
  validation_examples: 32
  shard_size: 8
  max_length: 128 # contiguous prefixes for independent block alignment
  matrix_length: 64 # quadratic materialization is only for this warmup
  max_cache_gb: 8
  effective_batch: 32
  matrix_steps: 50
  block_steps: 150
  block_freeze_ffn_steps: 75 # then allow low-LR adjustment of transferred FFNs
  attention_weight: 1.0
  block_weight: 1.0
  norm_weight: 0.1
recovery:
  examples: 2048
  positions: 16
  steps: 100
  freeze_steps: 25
  anchor_weight: 1.0
training:
  device: cuda
  precision: bfloat16 # use float32 explicitly on GPUs without BF16
  microbatch: 2 # conservative explicit starting point; reduce on OOM
  effective_batch: 256
  full_depth_steps: 300
  prefix_steps: 100
  matryoshka_steps: 500
  new_lr: 0.0003
  transferred_lr: 0.0001
  weight_decay: 0.01
  warmup_fraction: 0.05
  clip_grad: 1.0
  checkpoint_every: 25
  log_every: 5
  relational_weight: 0.1
  depth_weight: 0.05
  # fraction of each microbatch chosen from teacher-nearest neighbors
  neighbor_fraction: 0.5
  neighbor_pool: 4096
runtime:
  batches: [1, 4, 16]
  lengths: [1, 7, 32, 63, 64, 65, 128, 256, 512]
  fla_atol: 0.02
  onnx_atol: 0.0001
export:
  depths: [1, 3, 6, 9, 12]
  opset: 17
  example_length: 7
evaluation:
  max_examples: 1000
  split: test
  batch_size: 4
  benchmark_repeats: 20
  benchmark_length: 32
