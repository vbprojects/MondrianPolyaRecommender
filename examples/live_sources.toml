# One bounded round by default; pass --loop for continuous polling/subscriptions.
store = "data/live_disk_gte"
storage = "disk"
poll_interval = 5

[index]
dimension = 384
embedding_model = "TaylorAI/gte-tiny@4cc5e73d86a67c601897257b467187234aa3bca3"
rank = 4
half_life = 21600.0
retention_seconds = 604800.0
max_leaves = 128
split_after = 256
reservoir_cap = 64
merge_below = 8.0

[disk]
format = "f16"
layout = "append"
cache_mib = 256

[keywords]
enabled = true
method = "hashtags" # hashtags only; julia_yake retains extracted phrases + hashtags
# half_life defaults to the tree half-life; it can be configured independently.

[[sources]]
name = "bluesky-public"
kind = "bluesky"

