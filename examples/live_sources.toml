# One bounded round by default; pass --loop for continuous polling/subscriptions.
store = "data/live"
poll_interval = 5

[index]
dimension = 256
rank = 4
half_life = 21600.0
retention_seconds = 86400.0
max_leaves = 128
split_after = 256
reservoir_cap = 64
codec_batch = 256
merge_below = 8.0
merge_interval = 3600.0

[[sources]]
name = "bluesky-public"
kind = "bluesky"

