name: Build standalone application

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-app.yml'
      - 'build-support/**'
      - 'native/gte-worker/**'
      - 'src/**'
      - 'server/**'
      - 'julia-yake/**'
      - 'examples/live_sources.rust.toml'
      - 'test/live_sources.jl'
      - 'test/fixtures/**'
      - '.gitignore'
  pull_request:
    paths:
      - '.github/workflows/build-app.yml'
      - 'build-support/**'
      - 'native/gte-worker/**'
      - 'src/**'
      - 'server/**'
      - 'julia-yake/**'
      - 'examples/live_sources.rust.toml'
      - 'test/live_sources.jl'
      - 'test/fixtures/**'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: standalone-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      JULIA_VERSION: '1.13.0'
      RUSTUP_TOOLCHAIN: '1.97.1'
      JULIA_NUM_THREADS: '2,1'
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      JULIA_IMAGE_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare build memory and logs
        run: |
          mkdir -p output/ci-logs
          # Private-repository runners have less RAM than public-repository runners.
          # Bound LLVM parallelism above, and add swap on the smaller machines.
          if (( $(awk '/MemTotal/ {print $2}' /proc/meminfo) < 12 * 1024 * 1024 )); then
            sudo fallocate -l 4G "$RUNNER_TEMP/mondrian-build.swap"
            sudo chmod 600 "$RUNNER_TEMP/mondrian-build.swap"
            sudo mkswap "$RUNNER_TEMP/mondrian-build.swap"
            sudo swapon "$RUNNER_TEMP/mondrian-build.swap"
          fi
          free -h
          df -h .

      - name: Install Julia
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: ${{ env.JULIA_VERSION }}
          arch: x64

      - name: Install Python for asset preparation and testing
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Cache Julia dependencies and PackageCompiler base image
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.julia/artifacts
            ~/.julia/packages
            ~/.julia/registries
            ~/.julia/compiled
            ~/.julia/scratchspaces
          key: app-ubuntu24-x64-julia-${{ env.JULIA_VERSION }}-v1-${{ hashFiles('build-support/compiler/Project.toml', 'build-support/compiler/Manifest.toml', 'server/Project.toml', 'server/Manifest.toml') }}

      - name: Cache Rust dependencies and worker compilation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/gte-worker/target
          key: app-ubuntu24-x64-rust-${{ env.RUSTUP_TOOLCHAIN }}-v1-${{ hashFiles('native/gte-worker/Cargo.lock', 'native/gte-worker/Cargo.toml', 'native/gte-worker/src/**') }}
          restore-keys: |
            app-ubuntu24-x64-rust-${{ env.RUSTUP_TOOLCHAIN }}-v1-

      - name: Install pinned Julia environments
        run: |
          julia --startup-file=no --project=build-support/compiler -e 'using Pkg; Pkg.instantiate()' 2>&1 | tee output/ci-logs/compiler-environment.log
          julia --startup-file=no --project=server -e 'using Pkg; Pkg.instantiate()' 2>&1 | tee output/ci-logs/server-environment.log

      - name: Prepare pinned INT8 model and CPU runtime
        run: |
          # Only copy the native library from the wheel; Python is not shipped.
          python -m pip install --only-binary=:all: --no-deps onnxruntime==1.30.0
          python native/gte-worker/prepare.py 2>&1 | tee output/ci-logs/prepare.log

      - name: Test worker and source transports
        run: |
          cargo test --locked --manifest-path native/gte-worker/Cargo.toml 2>&1 | tee output/ci-logs/rust-tests.log
          julia --startup-file=no --project=server test/live_sources.jl 2>&1 | tee output/ci-logs/source-tests.log

      - name: Compile standalone applications
        run: |
          julia --startup-file=no --project=build-support/compiler build-support/build.jl 2>&1 | tee output/ci-logs/build.log

      - name: Verify relocation, ingestion, HTTP, and store compatibility
        run: |
          python build-support/smoke.py output/mondrian-app 2>&1 | tee output/ci-logs/smoke.log

      - name: Package verified application
        run: |
          git rev-parse HEAD > output/mondrian-app/share/mondrian/source-commit.txt
          cp output/gte_tiny_rust/bundle.json output/mondrian-app/share/mondrian/gte/bundle.json
          cp output/mondrian-app-smoke.json output/mondrian-app/share/mondrian/smoke-results.json
          tar -czf output/mondrian-app-linux-x86_64.tar.gz -C output mondrian-app
          gzip -t output/mondrian-app-linux-x86_64.tar.gz
          cd output
          sha256sum mondrian-app-linux-x86_64.tar.gz > mondrian-app-linux-x86_64.tar.gz.sha256

      - name: Upload verified Linux bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mondrian-app-linux-x86_64-${{ github.sha }}
          path: |
            output/mondrian-app-linux-x86_64.tar.gz
            output/mondrian-app-linux-x86_64.tar.gz.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Upload build logs and smoke results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mondrian-app-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci-logs/
            output/mondrian-app-smoke.json
            output/mondrian-app/share/mondrian/build.toml
          retention-days: 14
          if-no-files-found: warn
