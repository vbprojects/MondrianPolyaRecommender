[package]
name = "mondrian-gte-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.22.1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-30"] }
secp256k1 = { version = "=0.31.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
